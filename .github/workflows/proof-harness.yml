name: Wallet proof harness

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: proof-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gates:
    name: Fast contracts and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Run deterministic release gates
        run: chmod +x tests/run-fast.shm && chmod +x tests/harness/run-all.sh && bash tests/run-fast.sh

  browser-settlement:
    name: Chromium and settlement matrix
    needs: fast-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: tests/harness/package-lock.json

      # Cache harness node_modules for faster, repeatable installs
      - name: Cache harness node_modules
        uses: actions/cache@v4
        with:
          path: tests/harness/node_modules
          key: ${{ runner.os }}-harness-npm-${{ hashFiles('tests/harness/package-lock.json') }}
          restore-keys: ${{ runner.os }}-harness-npm-

      # Cache Playwright browser artifacts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('tests/harness/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-browsers-

      - name: Install pinned harness dependencies
        working-directory: tests/harness
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tests/harness
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          # ensure cache dir exists and is writable
          mkdir -p "${{ runner.temp }}/ms-playwright"
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxss1 \
            libasound2 \
            libgbm1 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            fonts-liberation \
            libdbus-1-3 || true
          # install only Chromium; --with-deps tries to install deps itself, but
          # we call apt-get above to be robust on CI
          npx playwright install --with-deps chromium

      - name: Run browser and independently validated settlement gates
        env:
          SKIP_MUTATIONS: "1"
          CI: "true"
        run:  chmod +x tests/harness/run-all.sh && bash tests/harness/run-all.sh

      - name: Upload scenario reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: settlement-proof-reports
          path: tests/harness/e2e-report-*.json
          if-no-files-found: warn
          retention-days: 30
