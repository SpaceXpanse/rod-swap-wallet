name: Release desktop artifacts

on:
  workflow_run:
    workflows:
      - Electron desktop build
    types:
      - completed
    branches:
      - "**"

concurrency:
  group: release-desktop-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 18

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Verify release gates and checksums
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prove fast gates
        run: chmod +x tests/run-fast.sh && chmod +x tests/harness/run-all.sh && bash tests/run-fast.sh

      - name: Verify SHA256SUMS is current
        run: |
          node tests/update-checksums.js
          git diff --exit-code -- SHA256SUMS

  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build ${{ matrix.name }} desktop artifact
    needs: verify
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runs_on: windows-latest
            package_command: npm run package:win
            artifact_name: release-electron-windows
          - name: Linux
            runs_on: ubuntu-latest
            package_command: npm run package:linux
            artifact_name: release-electron-linux
          - name: macOS
            runs_on: macos-latest
            package_command: npm run package:mac
            artifact_name: release-electron-macos
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Run Electron smoke test
        run: xvfb-run -a npm run test:smoke
        if: ${{ matrix.runs_on == 'ubuntu-latest' }}

      - name: Run Electron smoke test
        run: npm run test:smoke
        if: ${{ matrix.runs_on != 'ubuntu-latest' }}

      - name: Build desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.package_command }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: electron/dist/**
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish desktop release
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-${{ github.event.workflow_run.head_sha }}
      RELEASE_TARGET: ${{ github.event.workflow_run.head_sha }}
      RELEASE_DRAFT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release flags
        id: release_flags
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            prerelease_flag="--prerelease"
          fi

          draft_flag=""
          if [ "$RELEASE_DRAFT" = "true" ]; then
            draft_flag="--draft"
          fi

          echo "prerelease_flag=$prerelease_flag" >> "$GITHUB_OUTPUT"
          echo "draft_flag=$draft_flag" >> "$GITHUB_OUTPUT"

      - name: Collect release asset files
        shell: bash
        run: |
          find \
            release-artifacts/release-electron-windows \
            release-artifacts/release-electron-linux \
            release-artifacts/release-electron-macos \
            -maxdepth 1 -type f \
            \( \
              -name '*.exe' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.zip' \
            \) \
            | sort > release-assets.txt
          printf '%s\n' "SHA256SUMS" >> release-assets.txt

          if [ "$(wc -l < release-assets.txt)" -le 1 ]; then
            echo "No desktop package files were found for release upload." >&2
            exit 1
          fi

          cat release-assets.txt

      - name: Create or update GitHub release
        shell: bash
        run: |
          mapfile -t asset_files < release-assets.txt

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest=false \
              ${{ steps.release_flags.outputs.draft_flag }} \
              ${{ steps.release_flags.outputs.prerelease_flag }}
          fi

          gh release upload "$RELEASE_TAG" "${asset_files[@]}" --clobber
